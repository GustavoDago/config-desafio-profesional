server:
  port: 8089
spring:  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    instance:
      prefer-ip-address: true
app:
  keycloak:
    admin:
      clientId: admin-cli
    realm: spring
    serverUrl: http://localhost:9081